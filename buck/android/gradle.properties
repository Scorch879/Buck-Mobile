org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Plugin sources live in the pub cache on C: while this project builds on D:.
# Kotlin's incremental caches can't relativize paths across drives and fail with
# "Could not close incremental caches", so compile Kotlin non-incrementally.
kotlin.incremental=false

# Network resilience for dependency downloads on slow/unstable connections.
# IPv6 DNS lookups fail on some networks, so resolve over IPv4 only.
systemProp.java.net.preferIPv4Stack=true
# Keep successful DNS lookups for the daemon's lifetime and never cache failures,
# so one flaky lookup doesn't fail every request to that host.
systemProp.sun.net.inetaddr.ttl=3600
systemProp.sun.net.inetaddr.negative.ttl=0
# Raise HTTP timeouts from the 30s default (TCP connects can take 15-20s).
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
# Retry transient repository failures more times, with a longer backoff.
systemProp.org.gradle.internal.repository.max.retries=6
systemProp.org.gradle.internal.repository.initial.backoff=1000
