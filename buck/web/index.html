<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2B1309">
  <meta name="description" content="Buck - Finance & Expenses Tracker">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="buck">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>buck</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      min-height: 100% !important;
      height: auto !important;
      background-color: #2B1309 !important;
      background: #2B1309 !important;
      overflow-x: clip !important;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
      -webkit-tap-highlight-color: transparent;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    flutter-view,
    flt-glass-pane,
    flt-scene-host {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      display: block !important;
      background-color: #2B1309 !important;
      background: #2B1309 !important;
    }

    /* Hidden probes measuring CSS safe-area insets and dynamic vs large viewport height. */
    #buck-viewport-probe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      padding-top: env(safe-area-inset-top, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      pointer-events: none;
      visibility: hidden;
      z-index: -1;
    }

    #buck-lvh-probe {
      position: fixed;
      top: 0;
      left: 0;
      width: 0;
      height: 100lvh;
      pointer-events: none;
      visibility: hidden;
      z-index: -1;
    }
  </style>
</head>
<body>
  <div id="buck-viewport-probe" aria-hidden="true"></div>
  <div id="buck-lvh-probe" aria-hidden="true"></div>
  <script>
    // Re-apply viewport-fit=cover because Flutter Web rewrites the viewport
    // meta tag on startup, and expose safe-area insets without overriding
    // documentElement.clientWidth / clientHeight so Flutter matches 100dvh.
    (function() {
      function _buckEnsureViewportCover() {
        var meta = document.querySelector('meta[name="viewport"]');
        if (!meta) return;
        var content = meta.getAttribute('content') || '';
        if (content.indexOf('viewport-fit=cover') === -1) {
          meta.setAttribute('content', content + ', viewport-fit=cover');
        }
      }

      _buckEnsureViewportCover();
      if (typeof MutationObserver !== 'undefined' && document.head) {
        new MutationObserver(_buckEnsureViewportCover).observe(document.head, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ['content']
        });
      }

      window.buckGetSafeInsets = function() {
        try {
          var probe = document.getElementById('buck-viewport-probe');
          if (!probe) {
            return JSON.stringify({
              top: 0,
              bottom: 0,
              left: 0,
              right: 0,
              browserBarBottom: 0
            });
          }
          var style = window.getComputedStyle(probe);
          var envTop = parseFloat(style.paddingTop) || 0;
          var envRight = parseFloat(style.paddingRight) || 0;
          var envBottom = parseFloat(style.paddingBottom) || 0;
          var envLeft = parseFloat(style.paddingLeft) || 0;

          var barBottom = 0;
          var lvhProbe = document.getElementById('buck-lvh-probe');
          if (lvhProbe) {
            var lvhH = lvhProbe.getBoundingClientRect().height || 0;
            var dvhH = probe.getBoundingClientRect().height || window.innerHeight || 0;
            var vvH = (window.visualViewport && window.visualViewport.height) ? window.visualViewport.height : dvhH;
            var keyboardOpen = (dvhH - vvH) > 130;
            if (!keyboardOpen && lvhH > dvhH + 2) {
              barBottom = Math.min(96, Math.round(lvhH - dvhH));
            }
          }

          return JSON.stringify({
            top: envTop,
            bottom: envBottom,
            left: envLeft,
            right: envRight,
            browserBarBottom: barBottom
          });
        } catch (e) {
          return JSON.stringify({
            top: 0,
            bottom: 0,
            left: 0,
            right: 0,
            browserBarBottom: 0
          });
        }
      };

      var _buckInsetSubscribers = [];
      function _buckNotifyInsets() {
        for (var i = 0; i < _buckInsetSubscribers.length; i++) {
          try { _buckInsetSubscribers[i](); } catch (_) {}
        }
      }

      window.buckSubscribeSafeInsets = function(cb) {
        if (typeof cb === 'function') {
          _buckInsetSubscribers.push(cb);
        }
      };

      window.addEventListener('resize', _buckNotifyInsets, { passive: true });
      window.addEventListener('orientationchange', _buckNotifyInsets, { passive: true });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', _buckNotifyInsets, { passive: true });
        window.visualViewport.addEventListener('scroll', _buckNotifyInsets, { passive: true });
      }
      if (typeof ResizeObserver !== 'undefined') {
        var _ro = new ResizeObserver(_buckNotifyInsets);
        var p1 = document.getElementById('buck-viewport-probe');
        var p2 = document.getElementById('buck-lvh-probe');
        if (p1) _ro.observe(p1);
        if (p2) _ro.observe(p2);
      }

      window.buckSetThemeColor = function(hex) {
        try {
          if (!hex) return;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', hex);
          document.documentElement.style.setProperty('background-color', hex, 'important');
          document.documentElement.style.setProperty('background', hex, 'important');
          if (document.body) {
            document.body.style.setProperty('background-color', hex, 'important');
            document.body.style.setProperty('background', hex, 'important');
          }
          var host = document.querySelector('flutter-view');
          if (host) {
            host.style.setProperty('background-color', hex, 'important');
            host.style.setProperty('background', hex, 'important');
          }
        } catch (_) {}
      };
    })();

    window._buckLoadScript = function(src) {
      return new Promise(function(resolve, reject) {
        var existing = document.querySelector('script[src="' + src + '"]');
        if (existing) {
          if (window.Tesseract) {
            resolve();
          } else {
            existing.addEventListener('load', resolve);
            existing.addEventListener('error', reject);
          }
          return;
        }
        var script = document.createElement('script');
        script.src = src;
        script.async = true;
        script.onload = resolve;
        script.onerror = reject;
        document.head.appendChild(script);
      });
    };

    window.buckRecognizeReceiptBase64 = async function(base64Image) {
      try {
        if (!base64Image) return '';
        if (!window.Tesseract) {
          await window._buckLoadScript(
            'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'
          );
        }
        if (!window.Tesseract) return '';
        var mime = base64Image.startsWith('iVBOR') ? 'image/png' : 'image/jpeg';
        var result = await window.Tesseract.recognize(
          'data:' + mime + ';base64,' + base64Image,
          'eng'
        );
        return (result && result.data && result.data.text) ? result.data.text : '';
      } catch (e) {
        console.warn('Buck web OCR failed:', e);
        return '';
      }
    };
  </script>
  <script>
    // Unregister stale Flutter/PWA service workers and clear cached Flutter
    // assets so phones and browsers immediately receive fresh JS/WASM builds.
    (function() {
      var BUCK_CACHE_PURGE_KEY = 'buck_sw_purged_v4';
      (async function() {
        try {
          var hadController = Boolean(
            'serviceWorker' in navigator &&
            navigator.serviceWorker &&
            navigator.serviceWorker.controller
          );
          if ('serviceWorker' in navigator &&
              navigator.serviceWorker &&
              typeof navigator.serviceWorker.getRegistrations === 'function') {
            var registrations = await navigator.serviceWorker.getRegistrations();
            if (registrations && registrations.length) {
              var unregTasks = [];
              for (var i = 0; i < registrations.length; i++) {
                try {
                  unregTasks.push(
                    Promise.resolve(registrations[i].unregister()).catch(function() {})
                  );
                } catch (_) {}
              }
              await Promise.all(unregTasks);
            }
          }
          if ('caches' in window &&
              window.caches &&
              typeof window.caches.keys === 'function' &&
              typeof window.caches.delete === 'function') {
            var keys = await window.caches.keys();
            if (keys && keys.length) {
              var cacheTasks = [];
              for (var j = 0; j < keys.length; j++) {
                var key = keys[j];
                if (typeof key === 'string' &&
                    (key.indexOf('flutter-') === 0 || key.indexOf('workbox-') === 0)) {
                  try {
                    cacheTasks.push(
                      Promise.resolve(window.caches.delete(key)).catch(function() {})
                    );
                  } catch (_) {}
                }
              }
              await Promise.all(cacheTasks);
            }
          }
          try {
            if (hadController &&
                window.sessionStorage &&
                !window.sessionStorage.getItem(BUCK_CACHE_PURGE_KEY)) {
              window.sessionStorage.setItem(BUCK_CACHE_PURGE_KEY, '1');
              window.location.reload();
            }
          } catch (_) {}
        } catch (_) {}
      })();
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
