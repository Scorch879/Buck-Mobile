<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#100B09">
  <meta name="description" content="Buck - Finance & Expenses Tracker">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="buck">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>buck</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html {
      background-color: #100B09;
      background-image: linear-gradient(180deg, #100B09 0%, #180D09 18%, #351509 68%, #4A1D0B 100%);
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh !important;
      height: 100lvh !important;
      min-height: 100vh !important;
      min-height: 100lvh !important;
      min-height: -webkit-fill-available !important;
      overflow: hidden;
    }

    body,
    flutter-view,
    flt-glass-pane {
      background-color: transparent;
      margin: 0;
      padding: 0;
      width: 100% !important;
      height: 100vh !important;
      height: 100lvh !important;
      min-height: 100vh !important;
      min-height: 100lvh !important;
      min-height: -webkit-fill-available !important;
      bottom: auto !important;
      overflow: hidden;
    }

    /* Hidden probe measuring small-viewport height (100svh) and CSS safe-area
       insets so Flutter can pad controls above Safari's floating bars while
       the Flutter canvas extends edge-to-edge across 100lvh. */
    #buck-viewport-probe {
      position: fixed;
      top: 0;
      left: 0;
      width: 0;
      height: 100vh;
      height: 100svh;
      padding-top: env(safe-area-inset-top, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      pointer-events: none;
      visibility: hidden;
      z-index: -1;
    }
  </style>
</head>
<body>
  <div id="buck-viewport-probe" aria-hidden="true"></div>
  <script>
    // Flutter Web replaces <meta name="viewport"> during startup and strips
    // viewport-fit=cover. Re-apply it immediately so notched devices keep
    // edge-to-edge CSS env(safe-area-inset-*) and 100lvh coverage.
    (function() {
      function _buckEnsureViewportCover() {
        var meta = document.querySelector('meta[name="viewport"]');
        if (!meta) return;
        var content = meta.getAttribute('content') || '';
        if (content.indexOf('viewport-fit=cover') === -1) {
          meta.setAttribute('content', content + ', viewport-fit=cover');
        }
      }

      _buckEnsureViewportCover();
      if (typeof MutationObserver !== 'undefined' && document.head) {
        new MutationObserver(_buckEnsureViewportCover).observe(document.head, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ['content']
        });
      }

      window.buckGetSafeInsets = function() {
        try {
          var probe = document.getElementById('buck-viewport-probe');
          if (!probe) {
            return JSON.stringify({
              top: 0,
              bottom: 0,
              left: 0,
              right: 0,
              browserBarBottom: 0
            });
          }
          var style = window.getComputedStyle(probe);
          var envTop = parseFloat(style.paddingTop) || 0;
          var envRight = parseFloat(style.paddingRight) || 0;
          var envBottom = parseFloat(style.paddingBottom) || 0;
          var envLeft = parseFloat(style.paddingLeft) || 0;
          var largeH = document.documentElement.clientHeight || window.innerHeight || 0;
          var smallH = probe.clientHeight || largeH;
          var browserBarBottom = Math.max(0, largeH - smallH);
          return JSON.stringify({
            top: envTop,
            bottom: Math.max(envBottom, browserBarBottom),
            left: envLeft,
            right: envRight,
            browserBarBottom: browserBarBottom
          });
        } catch (e) {
          return JSON.stringify({
            top: 0,
            bottom: 0,
            left: 0,
            right: 0,
            browserBarBottom: 0
          });
        }
      };
    })();

    window._buckLoadScript = function(src) {
      return new Promise(function(resolve, reject) {
        var existing = document.querySelector('script[src="' + src + '"]');
        if (existing) {
          if (window.Tesseract) {
            resolve();
          } else {
            existing.addEventListener('load', resolve);
            existing.addEventListener('error', reject);
          }
          return;
        }
        var script = document.createElement('script');
        script.src = src;
        script.async = true;
        script.onload = resolve;
        script.onerror = reject;
        document.head.appendChild(script);
      });
    };

    window.buckRecognizeReceiptBase64 = async function(base64Image) {
      try {
        if (!base64Image) return '';
        if (!window.Tesseract) {
          await window._buckLoadScript(
            'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'
          );
        }
        if (!window.Tesseract) return '';
        var mime = base64Image.startsWith('iVBOR') ? 'image/png' : 'image/jpeg';
        var result = await window.Tesseract.recognize(
          'data:' + mime + ';base64,' + base64Image,
          'eng'
        );
        return (result && result.data && result.data.text) ? result.data.text : '';
      } catch (e) {
        console.warn('Buck web OCR failed:', e);
        return '';
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
