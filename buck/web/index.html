<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#100B09">
  <meta name="description" content="Buck - Finance & Expenses Tracker">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="buck">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>buck</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      background-color: #100B09;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <script>
    window._buckLoadScript = function(src) {
      return new Promise(function(resolve, reject) {
        var existing = document.querySelector('script[src="' + src + '"]');
        if (existing) {
          if (window.Tesseract) {
            resolve();
          } else {
            existing.addEventListener('load', resolve);
            existing.addEventListener('error', reject);
          }
          return;
        }
        var script = document.createElement('script');
        script.src = src;
        script.async = true;
        script.onload = resolve;
        script.onerror = reject;
        document.head.appendChild(script);
      });
    };

    window.buckRecognizeReceiptBase64 = async function(base64Image) {
      try {
        if (!base64Image) return '';
        if (!window.Tesseract) {
          await window._buckLoadScript(
            'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'
          );
        }
        if (!window.Tesseract) return '';
        var mime = base64Image.startsWith('iVBOR') ? 'image/png' : 'image/jpeg';
        var result = await window.Tesseract.recognize(
          'data:' + mime + ';base64,' + base64Image,
          'eng'
        );
        return (result && result.data && result.data.text) ? result.data.text : '';
      } catch (e) {
        console.warn('Buck web OCR failed:', e);
        return '';
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
